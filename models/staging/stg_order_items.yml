version: 2

models:
  - name: stg_order_items
    description: "Latest order items, with merchandise value and freight kept separate."
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: order_item_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: seller_id
        data_tests:
          - not_null

      - name: merchandise_value
        data_tests:
          - not_null

      - name: freight_value
        data_tests:
          - not_null
