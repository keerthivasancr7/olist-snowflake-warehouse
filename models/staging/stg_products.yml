version: 2

models:
  - name: stg_products
    description: "Latest products with typed numeric fields and unknown categories labelled."
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

      - name: product_category_name
        data_tests:
          - not_null

      - name: batch_id
        data_tests:
          - not_null
